<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 425" role="img" aria-labelledby="title desc">
  <title id="title">FDM与TDM的资源划分</title>
  <desc id="desc">左侧以不同频段同时传输三个用户的数据, 右侧在相同频段中按周期性时隙轮流传输. 两图横轴为时间, 纵轴为频率. 颜色与字母共同标识用户.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#35445e" stroke-width="1.2"/></marker></defs>
  <style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#29364f;font-size:14px}.title{font-size:20px;font-weight:600}.muted{fill:#5d6b82;font-size:12px}.axis{stroke:#35445e;stroke-width:1.5;marker-end:url(#arrow)}.a{fill:#d6e2f3}.b{fill:#eed9dd}.c{fill:#dbe8df}.band{stroke:#35445e;stroke-width:1.2}</style>
  <path d="M4 8H708V417H12V409H4Z" fill="#bdc6df"/>
  <path d="M2 2H706V409H10V401H2Z" fill="#f9fbff" stroke="#35445e" stroke-width="1.5"/>
  <text x="30" y="40" class="title">FDM / 频分复用</text>
  <text x="390" y="40" class="title">TDM / 时分复用</text>
  <text x="30" y="66" class="muted">不同频段, 同时持续使用</text>
  <text x="390" y="66" class="muted">同一频段, 按时隙轮流使用</text>
  <line x1="63" y1="285" x2="326" y2="285" class="axis"/><line x1="63" y1="285" x2="63" y2="103" class="axis"/>
  <text x="28" y="101" class="muted">频率</text><text x="300" y="308" class="muted">时间</text>
  <rect x="78" y="116" width="226" height="43" class="band a"/><rect x="78" y="170" width="226" height="43" class="band b"/><rect x="78" y="224" width="226" height="43" class="band c"/>
  <text x="183" y="143">A</text><text x="183" y="197">B</text><text x="183" y="251">C</text>
  <line x1="419" y1="285" x2="684" y2="285" class="axis"/><line x1="419" y1="285" x2="419" y2="103" class="axis"/>
  <text x="384" y="101" class="muted">频率</text><text x="656" y="308" class="muted">时间</text>
  <rect x="434" y="116" width="36" height="151" class="band a"/><rect x="470" y="116" width="36" height="151" class="band b"/><rect x="506" y="116" width="36" height="151" class="band c"/>
  <rect x="551" y="116" width="36" height="151" class="band a"/><rect x="587" y="116" width="36" height="151" class="band b"/><rect x="623" y="116" width="36" height="151" class="band c"/>
  <text x="447" y="197">A</text><text x="483" y="197">B</text><text x="519" y="197">C</text><text x="564" y="197">A</text><text x="600" y="197">B</text><text x="636" y="197">C</text>
  <path d="M434 318v7h108v-7M551 318v7h108v-7" stroke="#5d6b82" fill="none"/>
  <text x="465" y="345" class="muted">周期1</text><text x="582" y="345" class="muted">周期2</text>
  <text x="30" y="374">A, B, C为三条连接. 空闲连接预留的频段或时隙不会自动转给其他连接.</text>
  <text x="30" y="396" class="muted">示意图未按比例绘制, 省略保护频带和时隙切换开销.</text>
</svg>
